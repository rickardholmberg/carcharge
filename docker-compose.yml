services:
  carcharge:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Stockholm
      # Required when served under an nginx subpath (no trailing slash):
      # - WEB_BASE_PATH=/carcharge
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
